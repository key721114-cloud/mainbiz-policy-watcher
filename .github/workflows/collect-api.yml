name: 공고 수집 - API

on:
  schedule:
    # 09:00 / 15:00 / 21:00 KST (UTC 00:00 / 06:00 / 12:00). 필요하면 조정.
    - cron: "0 0,6,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 소스 하나가 실패해도(429, 일시 타임아웃 등) 스크립트는 exit 1을
      # 반환할 수 있다 - 그래도 나머지 소스가 수집한 데이터는 반드시 커밋
      # 돼야 하므로(개별 소스 실패가 전체 파이프라인을 막으면 안 됨) 이
      # 스텝만 continue-on-error로 두고, 잡 전체의 성공/실패 표시는 맨
      # 마지막 "수집 결과 확인" 스텝에서 따로 판정한다.
      - name: API 어댑터 실행
        id: fetch
        continue-on-error: true
        env:
          MSS_API_KEY: ${{ secrets.MSS_API_KEY }}
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        run: python scripts/run_api_adapters.py

      # data/announcements.json·source_status.json은 매 실행마다 통째로
      # 다시 쓰이는 파일이라 git이 자동으로 merge하지 못한다(크롤링 트랙과
      # 거의 동시에 돌면 rebase 충돌 발생 - 실제로 겪음). 그래서 이 두 파일은
      # 절대 그대로 커밋하지 않고, raw_api.json + 이번 실행 요약만 먼저
      # 커밋한 뒤, git pull로 크롤링 트랙의 최신 데이터까지 받아온 상태에서
      # scripts/build.py로 다시 만들어 커밋한다(순수 로컬 계산이라 재시도해도
      # 외부 API를 다시 부르지 않음).
      - name: raw 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 스크립트가 로컬 편의상 다시 써둔 announcements.json/source_status.json은
          # 어차피 build.py가 다시 만들 것이므로, pull --rebase가 걸리지 않게 되돌려둔다.
          git checkout -- data/announcements.json data/source_status.json 2>/dev/null || true
          git add data/raw_api.json data/status/api_last_run.json
          if git diff --cached --quiet; then
            echo "raw 변경 없음"
          else
            git commit -m "chore: API 원본 수집 데이터 갱신 [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: 최종 결과 재생성 및 커밋
        run: |
          for i in 1 2 3; do
            python scripts/build.py
            git add data/announcements.json data/source_status.json
            if git diff --cached --quiet; then
              echo "최종 결과 변경 없음"
              break
            fi
            git commit -m "chore: 최종 공고 목록 갱신 [skip ci]"
            if git push; then
              break
            fi
            echo "push 충돌, 재시도 ($i/3)"
            git reset --mixed HEAD~1
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done

      - name: 수집 결과 확인
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::일부 소스 수집 실패 - data/source_status.json에서 어느 소스인지 확인하세요. (성공한 소스의 데이터는 이미 커밋됨)"
          exit 1
