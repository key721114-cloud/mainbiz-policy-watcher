name: 공고 수집 - API

on:
  schedule:
    # 09:00 / 15:00 / 21:00 KST (UTC 00:00 / 06:00 / 12:00). 필요하면 조정.
    - cron: "0 0,6,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: API 어댑터 실행
        env:
          MSS_API_KEY: ${{ secrets.MSS_API_KEY }}
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        run: python scripts/run_api_adapters.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: API 공고 수집 결과 갱신 [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

